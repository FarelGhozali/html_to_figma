name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check
      run: npm run typecheck

    - name: Format Check
      run: npm run format:check

    - name: Run Linter
      run: npm run lint
      continue-on-error: true # Let it pass initially so we don't hard-block if there are many existing issues

    - name: Run Tests
      run: npm run test

    - name: Build Plugin
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: figma-plugin-dist
        path: |
          dist/
          manifest.json
        retention-days: 7
