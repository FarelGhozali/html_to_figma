<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transparency & Opacity Test</title>
    <style>
        body {
            background: linear-gradient(135deg, #f0abfc, #3b82f6);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
        }

        .glass-card {
            background-color: rgba(255, 255, 255, 0.2); /* 20% transparent white */
            border: 1px solid rgba(255, 255, 255, 0.4); /* 40% transparent border */
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: white;
            font-size: 32px;
            margin: 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
        }

        .buttons {
            display: flex;
            gap: 16px;
        }

        .btn-solid {
            background-color: rgba(255, 255, 255, 0.9);
            color: #3b82f6;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn-ghost {
            background-color: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 22px; /* Accounting for border width */
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Glassmorphism</h1>
        <p>This tests if the Figma plugin properly maps CSS rgba() background colors and border colors to Figma fills and strokes with opacity (0-1 alpha channel).</p>
        <div class="buttons">
            <div class="btn-solid">Accept</div>
            <div class="btn-ghost">Decline</div>
        </div>
    </div>
</body>
</html>
