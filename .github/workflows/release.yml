name: Release

on:
  push:
    branches:
      - main # Akan berjalan secara otomatis setiap push ke main

jobs:
  release:
    name: Automatic Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dibutuhkan untuk membuat Release & Tag
      issues: write # Dibutuhkan untuk komentar
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wajib agar semantic-release bisa membaca seluruh history commit

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Plugin
        run: npm run build

      - name: Create Plugin Archive
        run: zip -r html_to_figma_plugin.zip dist/ manifest.json

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
