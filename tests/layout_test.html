<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            padding: 40px;
            color: #1f2937;
        }
        .container {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { margin-bottom: 16px; font-size: 18px; }
        
        .box {
            width: 80px;
            height: 80px;
            background-color: #3b82f6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: 600;
        }

        /* Test 1: Row with Gap */
        .flex-row-gap {
            display: flex;
            flex-direction: row;
            gap: 16px;
            background-color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
        }

        /* Test 2: Space Between */
        .flex-space-between {
            display: flex;
            justify-content: space-between;
            background-color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
        }

        /* Test 3: Center Alignment */
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            background-color: #e5e7eb;
            border-radius: 8px;
        }

        /* Test 4: Column Layout */
        .flex-column {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            background-color: #e5e7eb;
            padding: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>1. Horizontal Row with Gap</h2>
        <div class="flex-row-gap">
            <div class="box">1</div>
            <div class="box" style="background-color: #ef4444;">2</div>
            <div class="box" style="background-color: #10b981;">3</div>
        </div>
    </div>

    <div class="container">
        <h2>2. Justify Content: Space Between</h2>
        <div class="flex-space-between">
            <div class="box">Left</div>
            <div class="box" style="background-color: #8b5cf6;">Right</div>
        </div>
    </div>

    <div class="container">
        <h2>3. Center Alignment (Horizontal & Vertical)</h2>
        <div class="flex-center">
            <div class="box" style="width: 120px; background-color: #f59e0b;">Centered</div>
        </div>
    </div>

    <div class="container">
        <h2>4. Vertical Column (Align Right)</h2>
        <div class="flex-column">
            <div class="box">Top</div>
            <div class="box" style="width: 120px; background-color: #ef4444;">Middle</div>
            <div class="box" style="width: 60px; background-color: #10b981;">Bottom</div>
        </div>
    </div>

</body>
</html>
